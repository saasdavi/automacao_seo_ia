name: Artigos diários (Gemini)

# 3 artigos por dia: 09h, 12h e 20h de Brasília (UTC-3). Provedor padrão: Gemini.
# Não pesquisa SERP: lê a linha já enriquecida pelo workflow "Enriquecer SERP".
on:
  schedule:
    - cron: '0 12 * * *'   # 09h
    - cron: '0 15 * * *'   # 12h
    - cron: '0 23 * * *'   # 20h
  workflow_dispatch:
    inputs:
      provedor:
        description: 'Provedor de IA para esta execução'
        required: false
        default: gemini
        type: choice
        options:
          - gemini
          - byteplus

# Uma execução por vez, para não gravar o CSV em paralelo
concurrency:
  group: artigos-diarios
  cancel-in-progress: false

jobs:
  artigos:
    runs-on: ubuntu-latest
    # Teto de segurança: uma execução travada não pode ficar horas rodando
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pandas requests beautifulsoup4

    - name: Gerar artigo com IA
      env:
        # Gemini primeiro; se falhar (cota, indisponível ou reprovado), Claude Haiku assume.
        LLM_PROVIDER: ${{ github.event.inputs.provedor || 'gemini' }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        MAX_ARTIGOS: '1'
      run: python scripts/gerar_artigo_gemini.py

    - name: Commit e push
      id: commit
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Artigos"
        git add dados/calendario_blog_1_ano.csv dados/saida/md/ dados/saida/html/
        if git diff --staged --quiet; then
          echo "novo=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m "🤖 Artigo automático: geração por IA"
        git pull --rebase -q origin "$GITHUB_REF_NAME"
        git push origin "HEAD:$GITHUB_REF_NAME"
        echo "novo=true" >> "$GITHUB_OUTPUT"

    # Commits feitos com o GITHUB_TOKEN não disparam outros workflows,
    # então o deploy precisa ser chamado daqui, logo após o push.
    - name: Publicar no site (Vercel)
      if: steps.commit.outputs.novo == 'true'
      env:
        VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      run: |
        if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
          echo "Secret VERCEL_DEPLOY_HOOK não configurado"
          exit 1
        fi
        curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" -o /dev/null
        echo "Deploy disparado após a geração"
