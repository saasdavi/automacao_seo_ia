name: Enriquecer SERP do Calendário

on:
  schedule:
    - cron: '0 13 * * *'   # 10h de Brasília: enriquece 5 linhas por dia
  workflow_dispatch:
    inputs:
      lotes:
        description: 'Quantas linhas enriquecer agora? (Padrão: 5)'
        required: false
        default: '5'
        type: number

# Mesmo grupo dos artigos: nunca grava o CSV em paralelo
concurrency:
  group: artigos-diarios
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pandas requests beautifulsoup4

    - name: Rodar script SERP
      env:
        # Chave do SerpAPI (serpapi.com)
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        MAX_ROWS: ${{ github.event.inputs.lotes || '5' }}
      run: python scripts/enriquecer_serp.py

    - name: Commit CSV atualizado
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action SERP"
        git add dados/calendario_blog_1_ano.csv dados/saida/md/
        git diff --staged --quiet || git commit -m "🤖 SERP: planilha enriquecida"
        git pull --rebase -q origin "$GITHUB_REF_NAME"
        git push origin "HEAD:$GITHUB_REF_NAME"
