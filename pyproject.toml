# ============================================================
# Projeto: Agendador SEO de Artigos (automacao_seo_ia)
# Configuração do pacote, dependências e ferramentas.
# ============================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agendador-seo"
version = "0.1.0"
description = "Pipeline de agendamento de 1.095 artigos SEO (365 dias x 3/dia) a partir do Google Keyword Planner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "saasdavi" }]
dependencies = [
    "pandas>=2.0",          # parsing/transformação de CSVs
    "pydantic>=2.5",        # validação e schema dos artigos
    "typer>=0.12",          # CLI moderna
    "fastapi>=0.110",       # API REST de consulta do cronograma
    "uvicorn>=0.27",        # servidor ASGI para a API
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",          # testes unitários/integração
    "pytest-cov>=4.1",      # medição de cobertura (meta >= 80%)
    "httpx>=0.27",          # cliente para testes da API
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
